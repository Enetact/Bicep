{
 "apiVersion":"apps/v1","kind":"Deployment",
 "metadata":{"name":{{ .Release.Name | quote }},"labels":{"app.kubernetes.io/instance":{{ .Release.Name | quote }},"app.kubernetes.io/managed-by":"Helm"}},
 "spec":{"replicas":{{ .Values.replicas }},"revisionHistoryLimit":3,
 "selector":{"matchLabels":{"app.kubernetes.io/instance":{{ .Release.Name | quote }}}},
 "strategy":{"type":"RollingUpdate","rollingUpdate":{"maxUnavailable":0,"maxSurge":1}},
 "template":{"metadata":{"labels":{"app.kubernetes.io/instance":{{ .Release.Name | quote }},"azure.workload.identity/use":"true"}},
 "spec":{"serviceAccountName":{{ .Values.serviceAccountName | quote }},"automountServiceAccountToken":false,
 "securityContext":{"runAsNonRoot":true,"runAsUser":1654,"runAsGroup":1654,"fsGroup":1654,"seccompProfile":{"type":"RuntimeDefault"}},
 "nodeSelector":{"kubernetes.io/os":"linux","kubernetes.azure.com/mode":"user"},
 "topologySpreadConstraints":[{"maxSkew":1,"topologyKey":"topology.kubernetes.io/zone","whenUnsatisfiable":"DoNotSchedule","labelSelector":{"matchLabels":{"app.kubernetes.io/instance":{{ .Release.Name | quote }}}}}],
 "terminationGracePeriodSeconds":30,
 "containers":[{"name":"app","image":{{ printf "%s@%s" .Values.imageRepository .Values.imageDigest | quote }},"imagePullPolicy":"Always",
 "ports":[{"name":"http","containerPort":{{ .Values.port }}}],
 "securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},
 "resources":{"requests":{"cpu":{{ .Values.cpuRequest | quote }},"memory":{{ .Values.memoryRequest | quote }}},"limits":{"cpu":{{ .Values.cpuLimit | quote }},"memory":{{ .Values.memoryLimit | quote }}}},
 "startupProbe":{"httpGet":{"path":"/health/ready","port":"http"},"failureThreshold":30,"periodSeconds":10},
 "readinessProbe":{"httpGet":{"path":"/health/ready","port":"http"},"periodSeconds":5},
 "livenessProbe":{"httpGet":{"path":"/health/live","port":"http"},"periodSeconds":10},
 "volumeMounts":[{"name":"tmp","mountPath":"/tmp"}]}],"volumes":[{"name":"tmp","emptyDir":{"sizeLimit":"64Mi"}}]}}}
}
