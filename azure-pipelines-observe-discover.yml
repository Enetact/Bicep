# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Discover - Observability. Fixed workload: observability.

parameters:
  - name: workload
    displayName: "Instance"
    type: string
    default: "observe"
    values:
      - "observe"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: subscription
    displayName: "Approved subscription"
    type: string
    default: "azure-subscription-a"
    values:
      - "azure-subscription-a"
  - name: network
    displayName: "Approved network profile"
    type: string
    default: "central-private"
    values:
      - "central-private"
  - name: workloadSummary
    displayName: "Observability - what a later deployment creates"
    type: string
    default: "1 Azure Monitor workbook and 1 scheduled query alert referencing an approved existing Log Analytics workspace and action group. Does not alter shared workspace networking or diagnostic settings on other resources."
    values:
      - "1 Azure Monitor workbook and 1 scheduled query alert referencing an approved existing Log Analytics workspace and action group. Does not alter shared workspace networking or diagnostic settings on other resources."
  - name: discoveryScope
    displayName: "This run - discovery only"
    type: string
    default: "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources. Also records required providers and resource IDs/types. Shared dependencies must be approved; missing shared networks are onboarding blockers, not automatic allocations."
    values:
      - "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources. Also records required providers and resource IDs/types. Shared dependencies must be approved; missing shared networks are onboarding blockers, not automatic allocations."
  - name: deploymentHandoff
    displayName: "Next step"
    type: string
    default: "After successful main discovery, open Deploy - Observability. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."
    values:
      - "After successful main discovery, open Deploy - Observability. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workloadType: observability
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: discover
