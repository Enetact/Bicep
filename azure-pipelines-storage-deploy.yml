# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Deploy - Private Storage Workspace. Fixed workload: private-storage.

resources:
  pipelines:
    - pipeline: discovery
      source: "Discover - Private Storage Workspace"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadName
    displayName: "Instance"
    type: string
    default: "storage"
    values:
      - "storage"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: executionMode
    displayName: "Run stages"
    type: string
    default: "Preview only"
    values:
      - "Preview only"
      - "Preview and deploy"
  - name: runGuidance
    displayName: "Current target status"
    type: string
    default: "All Private Storage Workspace targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
    values:
      - "All Private Storage Workspace targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
  - name: workloadSummary
    displayName: "Private Storage Workspace - resources created when enabled"
    type: string
    default: "1 identity-only StorageV2 account, workspace container, work queue, 2 private endpoints and storage diagnostics. Reuses approved subnet, DNS and Log Analytics."
    values:
      - "1 identity-only StorageV2 account, workspace container, work queue, 2 private endpoints and storage diagnostics. Reuses approved subnet, DNS and Log Analytics."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
    default: "Platform-reviewed existing network/DNS and monitoring bindings, owner, cost center and deployment identity are required. No automatic address allocation. Storage capacity/operations, two private endpoints, monitoring ingestion and network transfer."
    values:
      - "Platform-reviewed existing network/DNS and monitoring bindings, owner, cost center and deployment identity are required. No automatic address allocation. Storage capacity/operations, two private endpoints, monitoring ingestion and network transfer."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - Private Storage Workspace under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
      - "Select a successful main run from Discover - Private Storage Workspace under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
  - name: costAssumptions
    displayName: "Cost assumptions - retail as of not yet qualified"
    type: string
    default: "Estimate unavailable: not zero/free. Storage capacity/operations, two private endpoints, monitoring ingestion and network transfer. Complete reviewed pricing and platform onboarding before enabling deployment."
    values:
      - "Estimate unavailable: not zero/free. Storage capacity/operations, two private endpoints, monitoring ingestion and network transfer. Complete reviewed pricing and platform onboarding before enabling deployment."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: private-storage
    executionMode: ${{ parameters.executionMode }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
