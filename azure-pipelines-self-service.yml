# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none

parameters:
  - name: operation
    displayName: Read-only discovery or deployment
    type: string
    default: discover
    values: [discover, deploy]
  - name: workload
    displayName: Registered workload
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, prod, qa, uat]
  - name: subscription
    displayName: Approved subscription
    type: string
    default: unconfigured
    values: [unconfigured]
  - name: network
    displayName: Network profile
    type: string
    default: new-private
    values: [new-private]

variables:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}

stages:
  - ${{ if eq(parameters.operation, 'discover') }}:
    - template: pipelines/templates/self-service-discover.yml
      parameters:
        workload: ${{ parameters.workload }}
        environment: ${{ parameters.environment }}
        subscription: ${{ parameters.subscription }}
        network: ${{ parameters.network }}
  - ${{ if eq(parameters.operation, 'deploy') }}:
    - template: pipelines/templates/self-service-stages.yml
      parameters:
        workload: ${{ parameters.workload }}
        environment: ${{ parameters.environment }}
        subscription: ${{ parameters.subscription }}
        network: ${{ parameters.network }}
