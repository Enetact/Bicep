# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# Discover only. Publishes inventory; never provisions resources.

parameters:
  - name: workload
    displayName: Workload package (blobcopy = automated blob transfer)
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, prod, qa, uat]
  - name: subscription
    displayName: Approved subscription
    type: string
    default: azure-subscription-a
    values: [azure-subscription-a]
  - name: network
    displayName: Registered network profile
    type: string
    default: new-private
    values: [new-private]

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: discover
