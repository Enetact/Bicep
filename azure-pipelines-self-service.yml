# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# Discover only. Publishes inventory; never provisions resources.

parameters:
  - name: workload
    displayName: Workload package (blobcopy = automated blob transfer)
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, prod, qa, uat]
  - name: subscription
    displayName: Approved subscription
    type: string
    default: azure-subscription-a
    values: [azure-subscription-a]
  - name: network
    displayName: Registered network profile
    type: string
    default: new-private
    values: [new-private]
  - name: discoveryScope
    displayName: "What this run checks - read only"
    type: string
    default: "Lists networks, subnets and private DNS zones in the selected subscription, plus accessible matching ADO service connections. Empty results and failed reads are reported separately. No Azure resources or permissions are changed."
    values:
      - "Lists networks, subnets and private DNS zones in the selected subscription, plus accessible matching ADO service connections. Empty results and failed reads are reported separately. No Azure resources or permissions are changed."
  - name: deploymentHandoff
    displayName: "Next step - use the saved discovery in Deploy"
    type: string
    default: "For deployment, run discovery on main for the matching workload/environment. After success, open Deploy on main and select this run under Resources > discovery within seven days. Feature runs are diagnostic only. Discovery does not enable a target or prove deployment readiness."
    values:
      - "For deployment, run discovery on main for the matching workload/environment. After success, open Deploy on main and select this run under Resources > discovery within seven days. Feature runs are diagnostic only. Discovery does not enable a target or prove deployment readiness."

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: discover
