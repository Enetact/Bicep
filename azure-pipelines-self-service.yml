# Register separately from CI. Resource checks/permissions must be configured by
# platform owners; YAML conditions alone are not authorization controls.
trigger: none
pr: none

parameters:
  - name: workload
    displayName: Registered workload
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, qa, uat, prod]

variables:
  - template: pipelines/targets/${{ parameters.workload }}.yml
    parameters:
      environment: ${{ parameters.environment }}

stages:
  - stage: Qualify
    displayName: Validate selection, test, and freeze release
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - job: BuildBundle
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - pwsh: |
              . ./scripts/self-service-common.ps1
              $null = Read-ServiceTarget '${{ parameters.workload }}' '${{ parameters.environment }}'
            displayName: Reject disabled or invalid target before building
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              useGlobalJson: true
          - task: NodeTool@0
            inputs:
              versionSpec: 22.x
          - pwsh: |
              az bicep install --version v0.47.16
              if ($LASTEXITCODE -ne 0) { throw 'Bicep install failed.' }
              ./scripts/Update-Manifest.ps1 -Check
              ./scripts/Test-Project.ps1
              ./scripts/Test-Recovery.ps1
              ./scripts/Test-LocalTooling.ps1
              try {
                ./scripts/Run-Local.ps1
                ./scripts/Test-Local.ps1
              } finally {
                ./scripts/Stop-Local.ps1
              }
              ./scripts/Build-Package.ps1 -ReleaseId '$(Build.BuildId)'
              ./scripts/New-SelfServiceBundle.ps1 -Workload '${{ parameters.workload }}' -EnvironmentName '${{ parameters.environment }}' -ReleaseDirectory 'artifacts/releases/$(Build.BuildId)' -OutputDirectory 'artifacts/self-service/bundle'
            displayName: Qualify application and freeze target/template/package
          - publish: artifacts/self-service/bundle
            artifact: self-service-bundle
            displayName: Publish immutable inputs for this run
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: artifacts/**/*.trx
              failTaskOnFailedTests: true
          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: artifacts/test-results
              artifact: self-service-tests

  - template: pipelines/templates/self-service-plan.yml
    parameters:
      phase: Foundation
      dependsOn: Qualify
      serviceConnection: ${{ variables.serviceConnection }}
      agentPool: ${{ variables.agentPool }}
      deploymentEnvironment: ${{ variables.deploymentEnvironment }}
  - template: pipelines/templates/self-service-apply.yml
    parameters:
      phase: Foundation
      serviceConnection: ${{ variables.serviceConnection }}
      agentPool: ${{ variables.agentPool }}
      deploymentEnvironment: ${{ variables.deploymentEnvironment }}
  - template: pipelines/templates/self-service-plan.yml
    parameters:
      phase: Release
      dependsOn: ApplyFoundation
      serviceConnection: ${{ variables.serviceConnection }}
      agentPool: ${{ variables.agentPool }}
      deploymentEnvironment: ${{ variables.deploymentEnvironment }}
  - template: pipelines/templates/self-service-apply.yml
    parameters:
      phase: Release
      serviceConnection: ${{ variables.serviceConnection }}
      agentPool: ${{ variables.agentPool }}
      deploymentEnvironment: ${{ variables.deploymentEnvironment }}
