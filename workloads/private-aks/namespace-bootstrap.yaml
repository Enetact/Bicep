# Platform-owned example: review then apply separately using cluster administration.
# The Helm delivery pipeline never creates or adopts these objects.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-apps
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-budget
  namespace: platform-apps
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "16"
    limits.memory: 8Gi
    pods: "12"
    services: "4"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: application-defaults
  namespace: platform-apps
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: 1000m, memory: 512Mi }
