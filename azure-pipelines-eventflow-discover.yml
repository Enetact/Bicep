      - "azure-subscription-a"
  - name: network
    displayName: "Approved network profile"
    type: string
    default: "central-private"
    values:
      - "central-private"
  - name: workloadSummary
    displayName: "Event flow - what a later deployment creates"
    type: string
    default: "Processes document events: 1 Logic App Standard + hosting plan, 1 Event Grid topic + subscription, 2 Storage accounts, events queue, receipt/quarantine/dead-letter containers, 8 private endpoints, managed identities, Application Insights and 5 alerts. Saved discovery resolves approved existing prerequisites or plans missing workload-owned VNet/subnets, DNS zones/links and Log Analytics."
    values:
      - "Processes document events: 1 Logic App Standard + hosting plan, 1 Event Grid topic + subscription, 2 Storage accounts, events queue, receipt/quarantine/dead-letter containers, 8 private endpoints, managed identities, Application Insights and 5 alerts. Saved discovery resolves approved existing prerequisites or plans missing workload-owned VNet/subnets, DNS zones/links and Log Analytics."
  - name: discoveryScope
    displayName: "This run - discovery only"
    type: string
    default: "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources. Also checks providers, resource IDs/types and stack ownership; saves Reuse/Create/Manage/Blocked prerequisite decisions without creating resources."
    values:
      - "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources. Also checks providers, resource IDs/types and stack ownership; saves Reuse/Create/Manage/Blocked prerequisite decisions without creating resources."
  - name: deploymentHandoff
    displayName: "Next step"
    type: string
    default: "After successful main discovery, open Deploy - Event flow. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."
    values:
      - "After successful main discovery, open Deploy - Event flow. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workloadType: logic-app-event-grid
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: discover
