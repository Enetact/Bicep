trigger: none
pr: none
# ADO definition: Discover - Event flow. Fixed workload: logic-app-event-grid.

parameters:
  - name: workload
    displayName: "Instance"
    type: string
    default: "eventflow"
    values:
      - "eventflow"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
