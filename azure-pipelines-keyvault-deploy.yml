# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Deploy - Key Vault. Fixed workload: key-vault.

resources:
  pipelines:
    - pipeline: discovery
      source: "Discover - Key Vault"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadName
    displayName: "Instance"
    type: string
    default: "keyvault"
    values:
      - "keyvault"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: executionMode
    displayName: "Run stages"
    type: string
    default: "Preview only"
    values:
      - "Preview only"
      - "Preview and deploy"
  - name: runGuidance
    displayName: "Current target status"
    type: string
    default: "All Key Vault targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
    values:
      - "All Key Vault targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
  - name: workloadSummary
    displayName: "Key Vault - resources created when enabled"
    type: string
    default: "1 RBAC Key Vault with soft delete and purge protection, 1 private endpoint, a scoped reader grant and audit diagnostics. No secret values are created."
    values:
      - "1 RBAC Key Vault with soft delete and purge protection, 1 private endpoint, a scoped reader grant and audit diagnostics. No secret values are created."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
    default: "Platform-reviewed existing network/DNS and monitoring bindings, owner, cost center and deployment identity are required. No automatic address allocation. Vault operations, one private endpoint, audit logs and transfer."
    values:
      - "Platform-reviewed existing network/DNS and monitoring bindings, owner, cost center and deployment identity are required. No automatic address allocation. Vault operations, one private endpoint, audit logs and transfer."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - Key Vault under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
      - "Select a successful main run from Discover - Key Vault under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
  - name: costAssumptions
    displayName: "Cost assumptions - retail as of not yet qualified"
    type: string
    default: "Estimate unavailable: not zero/free. Vault operations, one private endpoint, audit logs and transfer. Complete reviewed pricing and platform onboarding before enabling deployment."
    values:
      - "Estimate unavailable: not zero/free. Vault operations, one private endpoint, audit logs and transfer. Complete reviewed pricing and platform onboarding before enabling deployment."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: key-vault
    executionMode: ${{ parameters.executionMode }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
