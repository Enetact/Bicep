trigger: none
pr: none
# ADO definition: Discover - Fabric Premium Workspace. Fixed workload: fabric.

parameters:
  - name: workload
    displayName: "Instance"
    type: string
    default: "fabric"
    values:
      - "fabric"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: subscription
    displayName: "Approved subscription"
    type: string
    default: "azure-subscription-a"
    values:
      - "azure-subscription-a"
  - name: network
    displayName: "Approved network profile"
    type: string
    default: "central-private"
    values:
      - "central-private"
  - name: workloadSummary
    displayName: "Fabric Premium Workspace - what a later deployment creates"
    type: string
    default: "F64-or-larger Fabric capacity with a separately provisioned Managed DevOps Pool for protected delivery. Existing private workspaces use their reviewed workspace API endpoint, isolated subnets and private DNS checks."
    values:
      - "F64-or-larger Fabric capacity with a separately provisioned Managed DevOps Pool for protected delivery. Existing private workspaces use their reviewed workspace API endpoint, isolated subnets and private DNS checks."
  - name: discoveryScope
    displayName: "This run - discovery only"
    type: string
    default: "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources. Also records required providers and resource IDs/types. Shared dependencies must be approved; missing shared networks are onboarding blockers, not automatic allocations."
    values:
      - "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources. Also records required providers and resource IDs/types. Shared dependencies must be approved; missing shared networks are onboarding blockers, not automatic allocations."
  - name: deploymentHandoff
    displayName: "Next step"
    type: string
    default: "After successful main discovery, open Deploy - Fabric Premium Workspace. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."
    values:
      - "After successful main discovery, open Deploy - Fabric Premium Workspace. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workloadType: fabric
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: discover
