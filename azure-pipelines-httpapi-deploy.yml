# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Deploy - HTTP Functions API. Fixed workload: http-functions.

resources:
  pipelines:
    - pipeline: discovery
      source: "Discover - HTTP Functions API"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadName
    displayName: "Instance"
    type: string
    default: "httpapi"
    values:
      - "httpapi"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: executionMode
    displayName: "Run stages"
    type: string
    default: "Preview only"
    values:
      - "Preview only"
      - "Preview and deploy"
  - name: runGuidance
    displayName: "Current target status"
    type: string
    default: "All HTTP Functions API targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
    values:
      - "All HTTP Functions API targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
  - name: workloadSummary
    displayName: "HTTP Functions API - resources created when enabled"
    type: string
    default: "1 private .NET 10 HTTP Function App on a dedicated Linux B1 plan, identity, host/package storage, 4 private endpoints, diagnostics and a separately versioned health API sample. Entra authentication is required."
    values:
      - "1 private .NET 10 HTTP Function App on a dedicated Linux B1 plan, identity, host/package storage, 4 private endpoints, diagnostics and a separately versioned health API sample. Entra authentication is required."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
    default: "Platform-reviewed existing network/DNS and monitoring bindings, owner, cost center and deployment identity are required. No automatic address allocation. Dedicated B1 hosting, storage, four private endpoints, logs and network transfer."
    values:
      - "Platform-reviewed existing network/DNS and monitoring bindings, owner, cost center and deployment identity are required. No automatic address allocation. Dedicated B1 hosting, storage, four private endpoints, logs and network transfer."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - HTTP Functions API under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
      - "Select a successful main run from Discover - HTTP Functions API under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
  - name: costAssumptions
    displayName: "Cost assumptions - retail as of not yet qualified"
    type: string
    default: "Estimate unavailable: not zero/free. Dedicated B1 hosting, storage, four private endpoints, logs and network transfer. Complete reviewed pricing and platform onboarding before enabling deployment."
    values:
      - "Estimate unavailable: not zero/free. Dedicated B1 hosting, storage, four private endpoints, logs and network transfer. Complete reviewed pricing and platform onboarding before enabling deployment."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: http-functions
    executionMode: ${{ parameters.executionMode }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
