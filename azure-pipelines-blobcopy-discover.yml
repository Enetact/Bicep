# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Discover - Blob copy. Fixed workload: blob-transfer.

parameters:
  - name: workload
    displayName: "Instance"
    type: string
    default: "blobcopy"
    values:
      - "blobcopy"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: subscription
    displayName: "Approved subscription"
    type: string
    default: "azure-subscription-a"
    values:
      - "azure-subscription-a"
  - name: network
    displayName: "Approved network profile"
    type: string
    default: "new-private"
    values:
      - "new-private"
  - name: workloadSummary
    displayName: "Blob copy - what a later deployment creates"
    type: string
    default: "Copies uploaded files to an existing data lake: 1 Function App + hosting plan, 2 Storage accounts, work/poison queues, transfer ledger, managed identity, Application Insights and alerts. Private endpoints and DNS follow the approved environment profile."
    values:
      - "Copies uploaded files to an existing data lake: 1 Function App + hosting plan, 2 Storage accounts, work/poison queues, transfer ledger, managed identity, Application Insights and alerts. Private endpoints and DNS follow the approved environment profile."
  - name: discoveryScope
    displayName: "This run - discovery only"
    type: string
    default: "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources."
    values:
      - "Read-only networks, subnets, private DNS and accessible matching service connections. Creates no Azure resources."
  - name: deploymentHandoff
    displayName: "Next step"
    type: string
    default: "After successful main discovery, open Deploy - Blob copy. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."
    values:
      - "After successful main discovery, open Deploy - Blob copy. Under Resources > discovery select this run. Use the same instance/environment; the artifact must be at most seven days old."

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workloadType: blob-transfer
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: discover
