# Temporary hosted setup path for disabled targets; no Azure tasks or deployment jobs.
parameters:
  - name: workload
    type: string
  - name: environment
    type: string
  - name: subscription
    type: string
  - name: network
    type: string
  - name: serviceConnection
    type: string
  - name: discoveryPipelineId
    type: string
  - name: discoveryRunId
    type: string
  - name: createDestinationPrivateEndpoints
    type: boolean
  - name: enableLogAlerts
    type: boolean
stages:
  - stage: SetupOnly
    displayName: Hosted setup check - no Azure deployment
    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - job: CheckSetup
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - pwsh: |
              . ./scripts/self-service-common.ps1
              $target = Read-ServiceTarget '${{ parameters.workload }}' '${{ parameters.environment }}' '${{ parameters.subscription }}' '${{ parameters.network }}' -AllowDisabled
              if ($target.enabled) { throw 'Target was enabled without regenerating catalog routing. Run Update-ServiceCatalog.ps1.' }
              ./scripts/Update-ServiceCatalog.ps1 -Check
              $publication = (Read-StackConfiguration (Get-TargetWorkloadType $target)).templateSpec
              $evidence = '$(Build.ArtifactStagingDirectory)/setup'
              New-Item -ItemType Directory -Path $evidence -Force | Out-Null
              $summary = Join-Path $evidence 'setup-only.md'
              @(
                '# Setup check only - Azure NOT deployed'
                ''
                'This target is disabled. Only its checked-in configuration was checked on a Microsoft-hosted Windows agent.'
                "Target: $($target.workload) / $($target.environmentName) / $($target.subscriptionAlias) / $($target.networkProfile)."
                "Workload pattern: $(Get-TargetWorkloadType $target). Network, monitoring and resource options come from the reviewed platform profile."
                ''
                'The selected discovery artifact was not downloaded or validated. No bundle, what-if or readiness receipt was produced.'
                ''
                '## Before enabling deployment'
                "- Configure and authorize private agent pool: $($target.agentPool)."
                '- Verify private routing/DNS and required agent tools.'
                "- Configure environment approvals/lock: $($target.deploymentEnvironment)."
                "- Verify service connection: $($target.serviceConnection), Azure scopes and destination prerequisites."
                "- Prepare Template Spec catalog: $($publication.resourceGroup) / $($publication.name); authorize publisher connection $($publication.publisherServiceConnection), pool $($publication.publisherAgentPool) and protected environment $($publication.publisherEnvironment)."
                '- Configure external Required Template and main-branch checks, approvals and exclusive locks in ADO.'
                '- Use a fresh dedicated workload resource group owned by the Deployment Stack; review existing groups separately.'
                '- Local Bicep modules are embedded during qualification. No module registry is required.'
                '- For logic-app-event-grid: supply two dedicated subnets, six linked DNS zones, workspace and principal IDs; approve the trusted-service delivery and runtime-storage credential exceptions. See workloads/logic-app-event-grid/README.md.'
                '- Review the target parameters, enable the target, regenerate the catalog and source manifest, then merge.'
                '- Queue Deploy with a matching successful main discovery run. The private-pool deployment workflow will then be restored.'
              ) | Set-Content -LiteralPath $summary
              Write-Host '##vso[task.logissue type=warning]Setup check only: target disabled; no Azure deployment or discovery-artifact validation performed.'
              Write-Host "##vso[task.uploadsummary]$summary"
              Write-Host '##vso[task.setvariable variable=setupEvidencePrepared]true'
            displayName: Check disabled target and report remaining setup
            env:
              CREATE_DESTINATION_ENDPOINTS: ${{ parameters.createDestinationPrivateEndpoints }}
              ENABLE_LOG_ALERTS: ${{ parameters.enableLogAlerts }}
          - publish: $(Build.ArtifactStagingDirectory)/setup
            artifact: setup-guidance
            condition: and(always(), eq(variables['setupEvidencePrepared'], 'true'))
