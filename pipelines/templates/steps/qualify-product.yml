parameters:
  - name: workloadType
    type: string
steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      useGlobalJson: true
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - pwsh: |
      az bicep install --version v0.47.16
      if ($LASTEXITCODE -ne 0) { throw 'Bicep install failed.' }
      ./scripts/Update-Manifest.ps1 -Check
      ./scripts/Test-Project.ps1
      ./scripts/Build-ProductPackage.ps1 -WorkloadType '${{ parameters.workloadType }}' -ReleaseId '$(Build.BuildId)'
    displayName: Qualify product and create typed release receipt
