# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# Developer intent only. Platform owns topology and security options.

resources:
  pipelines:
    - pipeline: discovery
      source: "Enetact.Bicep"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadType
    displayName: Approved workload pattern
    type: string
    default: blob-transfer
    values: [blob-transfer]
  - name: workloadName
    displayName: Registered workload
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values: [dev, prod, qa, uat]
  - name: region
    displayName: Approved region
    type: string
    default: eastus2
    values: [eastus2]
  - name: runGuidance
    displayName: "Before running - discovery, approvals and readiness"
    type: string
    default: "Use main. Under Resources > discovery, select a successful main run for the same workload/environment. Enabled targets publish the approved template, preview changes for approval, deploy and verify the application. Disabled targets run setup checks only."
    values:
      - "Use main. Under Resources > discovery, select a successful main run for the same workload/environment. Enabled targets publish the approved template, preview changes for approval, deploy and verify the application. Disabled targets run setup checks only."
  - name: packageResources
    displayName: "Included core resources (required)"
    type: string
    default: "Function App + hosting; 2 Storage accounts, queues + ledger; managed identity + RBAC; Log Analytics + Application Insights."
    values:
      - "Function App + hosting; 2 Storage accounts, queues + ledger; managed identity + RBAC; Log Analytics + Application Insights."
  - name: hostingEstimate
    displayName: "Hosting reference - USD per instance/month (East US 2; 2026-09-19)"
    type: string
    default: "B1 $12.41; S1 $69.35; P1v3 $113.15. Multiply by profile instance count; exact selected subtotal is published during qualification."
    values:
      - "B1 $12.41; S1 $69.35; P1v3 $113.15. Multiply by profile instance count; exact selected subtotal is published during qualification."
  - name: packageNetworking
    displayName: "Platform-managed private access"
    type: string
    default: "Private access, endpoints, DNS and routing follow the approved platform profile. Reference: 6 core endpoints $43.80/month; destination adds up to $14.60/month. Shared networking remains separately billable."
    values:
      - "Private access, endpoints, DNS and routing follow the approved platform profile. Reference: 6 core endpoints $43.80/month; destination adds up to $14.60/month. Shared networking remains separately billable."
  - name: usageEstimate
    displayName: "Additional usage charges - not included in fixed amounts"
    type: string
    default: "Storage capacity/transactions, endpoint data, egress, notifications and agent costs vary. Logs: $2.76/GB at paid tier; DNS queries: $0.40/million. Allowances depend on subscription usage."
    values:
      - "Storage capacity/transactions, endpoint data, egress, notifications and agent costs vary. Logs: $2.76/GB at paid tier; DNS queries: $0.40/million. Allowances depend on subscription usage."
  - name: packageRequirements
    displayName: "Requirements / USD retail as of 2026-09-19"
    type: string
    default: "Platform owns connection, destination, agent, network and alert settings. 3 alert rules: ~4.5/month plus usage. Prices: East US 2, 730 hours/month, excluding tax/discounts/credits. Not a spending cap. Disabled targets run setup only."
    values:
      - "Platform owns connection, destination, agent, network and alert settings. 3 alert rules: ~4.5/month plus usage. Prices: East US 2, 730 hours/month, excluding tax/discounts/credits. Not a spending cap. Disabled targets run setup only."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: ${{ parameters.workloadType }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
