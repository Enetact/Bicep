# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none

parameters:
  - name: workload
    displayName: Registered workload
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, prod, qa, uat]
  - name: subscription
    displayName: Approved subscription
    type: string
    default: unconfigured
    values: [unconfigured]
  - name: network
    displayName: Network profile
    type: string
    default: new-private
    values: [new-private]
  - name: discoveryPipelineId
    displayName: Discovery pipeline ID (from saved summary)
    type: string
    default: '0'
  - name: discoveryRunId
    displayName: Discovery run ID (from saved summary)
    type: string
    default: '0'

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      operation: deploy
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      discoveryPipelineId: ${{ parameters.discoveryPipelineId }}
      discoveryRunId: ${{ parameters.discoveryRunId }}
