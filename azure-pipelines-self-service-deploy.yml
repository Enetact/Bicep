# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# Deploy only. Choose the discovery run using Run pipeline > Resources > discovery.

resources:
  pipelines:
    - pipeline: discovery
      source: "Enetact.Bicep"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workload
    displayName: Workload package (blobcopy = automated blob transfer)
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, prod, qa, uat]
  - name: subscription
    displayName: Approved subscription
    type: string
    default: azure-subscription-a
    values: [azure-subscription-a]
  - name: network
    displayName: Registered network profile
    type: string
    default: new-private
    values: [new-private]
  - name: packageResources
    displayName: "Included core resources (required)"
    type: string
    default: "Function App + hosting; 2 Storage accounts, queues + ledger; managed identity + RBAC; Log Analytics + Application Insights. Optional choices below apply only to deploy."
    values:
      - "Function App + hosting; 2 Storage accounts, queues + ledger; managed identity + RBAC; Log Analytics + Application Insights. Optional choices below apply only to deploy."
  - name: hostingEstimate
    displayName: "Hosting reference - USD per instance/month (East US 2; 2026-09-19)"
    type: string
    default: "B1 $12.41; S1 $69.35; P1v3 $113.15. Multiply by profile instance count; exact selected subtotal is published during qualification."
    values:
      - "B1 $12.41; S1 $69.35; P1v3 $113.15. Multiply by profile instance count; exact selected subtotal is published during qualification."
  - name: packageNetworking
    displayName: "Required private networking - estimated USD/month"
    type: string
    default: "6 storage/app private endpoints: $43.80. New mode adds 5 DNS zones: $2.50 + queries, VNet, 2 subnets and NSG. Existing mode reuses approved networking."
    values:
      - "6 storage/app private endpoints: $43.80. New mode adds 5 DNS zones: $2.50 + queries, VNet, 2 subnets and NSG. Existing mode reuses approved networking."
  - name: usageEstimate
    displayName: "Additional usage charges - not included in fixed amounts"
    type: string
    default: "Storage capacity/transactions, endpoint data, egress and agent costs vary. Logs: $2.76/GB at paid tier; DNS queries: $0.40/million. Allowances depend on subscription usage."
    values:
      - "Storage capacity/transactions, endpoint data, egress and agent costs vary. Logs: $2.76/GB at paid tier; DNS queries: $0.40/million. Allowances depend on subscription usage."
  - name: packageRequirements
    displayName: "Estimate basis - USD retail as of 2026-09-19"
    type: string
    default: "East US 2; 730 hours/month; no tax, discounts or credits. Not a quote or spending cap. Existing destination storage and private build agent required. Exact resource changes appear in preview."
    values:
      - "East US 2; 730 hours/month; no tax, discounts or credits. Not a quote or spending cap. Existing destination storage and private build agent required. Exact resource changes appear in preview."
  - name: createDestinationPrivateEndpoints
    displayName: "Create destination private endpoints (~$7.30 each/month; blob+dfs ~$14.60). Uncheck only to reuse existing private connectivity."
    type: boolean
    default: true
  - name: enableLogAlerts
    displayName: "Enable 3 log alerts (~$4.50/month + notifications). Required in production; logs remain enabled when unchecked."
    type: boolean
    default: true

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: deploy
      discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
      discoveryRunId: $(resources.pipeline.discovery.runID)
      createDestinationPrivateEndpoints: ${{ parameters.createDestinationPrivateEndpoints }}
      enableLogAlerts: ${{ parameters.enableLogAlerts }}
