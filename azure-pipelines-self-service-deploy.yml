# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# Deploy only. Choose the discovery run using Run pipeline > Resources > discovery.

resources:
  pipelines:
    - pipeline: discovery
      source: "Enetact.Bicep"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workload
    displayName: Workload package (blobcopy = automated blob transfer)
    type: string
    default: blobcopy
    values: [blobcopy]
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, prod, qa, uat]
  - name: subscription
    displayName: Approved subscription
    type: string
    default: azure-subscription-a
    values: [azure-subscription-a]
  - name: network
    displayName: Registered network profile
    type: string
    default: new-private
    values: [new-private]
  - name: createDestinationPrivateEndpoints
    displayName: "Create destination private endpoints (~USD $7.30-$14.60/month)"
    type: boolean
    default: true
  - name: enableLogAlerts
    displayName: "Enable log alerts (~USD $4.50/month)"
    type: boolean
    default: true
  - name: packageResources
    displayName: "Included core resources (required)"
    type: string
    default: "Function App + hosting; 2 Storage accounts, queues + ledger; managed identity + RBAC; Log Analytics + Application Insights."
    values:
      - "Function App + hosting; 2 Storage accounts, queues + ledger; managed identity + RBAC; Log Analytics + Application Insights."
  - name: hostingEstimate
    displayName: "Hosting reference - USD per instance/month (East US 2; 2026-09-19)"
    type: string
    default: "B1 $12.41; S1 $69.35; P1v3 $113.15. Multiply by profile instance count; exact selected subtotal is published during qualification."
    values:
      - "B1 $12.41; S1 $69.35; P1v3 $113.15. Multiply by profile instance count; exact selected subtotal is published during qualification."
  - name: packageNetworking
    displayName: "Private networking and endpoint options"
    type: string
    default: "Required: 6 private endpoints $43.80/month; new mode adds 5 DNS zones $2.50/month, VNet, 2 subnets and NSG. Destination option adds blob + dfs if HNS. Uncheck only with existing private access/DNS; existing endpoints are not deleted."
    values:
      - "Required: 6 private endpoints $43.80/month; new mode adds 5 DNS zones $2.50/month, VNet, 2 subnets and NSG. Destination option adds blob + dfs if HNS. Uncheck only with existing private access/DNS; existing endpoints are not deleted."
  - name: usageEstimate
    displayName: "Additional usage charges - not included in fixed amounts"
    type: string
    default: "Storage capacity/transactions, endpoint data, egress, notifications and agent costs vary. Logs: $2.76/GB at paid tier; DNS queries: $0.40/million. Allowances depend on subscription usage."
    values:
      - "Storage capacity/transactions, endpoint data, egress, notifications and agent costs vary. Logs: $2.76/GB at paid tier; DNS queries: $0.40/million. Allowances depend on subscription usage."
  - name: packageRequirements
    displayName: "Requirements / USD retail as of 2026-09-19"
    type: string
    default: "Existing destination storage and private agent required. Alerts: 3 rules; required in production; disabling keeps log collection. Prices: East US 2, 730 hours/month, excluding tax/discounts/credits. Not a quote or spending cap. Review exact changes in preview."
    values:
      - "Existing destination storage and private agent required. Alerts: 3 rules; required in production; disabling keeps log collection. Prices: East US 2, 730 hours/month, excluding tax/discounts/credits. Not a quote or spending cap. Review exact changes in preview."

stages:
  - template: pipelines/catalog-bindings.yml
    parameters:
      workload: ${{ parameters.workload }}
      environment: ${{ parameters.environment }}
      subscription: ${{ parameters.subscription }}
      network: ${{ parameters.network }}
      operation: deploy
      discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
      discoveryRunId: $(resources.pipeline.discovery.runID)
      createDestinationPrivateEndpoints: ${{ parameters.createDestinationPrivateEndpoints }}
      enableLogAlerts: ${{ parameters.enableLogAlerts }}
