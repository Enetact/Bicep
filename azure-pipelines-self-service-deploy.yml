# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# Developer intent only. Platform owns topology and security options.

resources:
  pipelines:
    - pipeline: discovery
      source: "Enetact.Bicep"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadType
    displayName: "1. What do you want to deploy?"
    type: string
    default: "Blob copy - Function App + 2 Storage accounts | blob-transfer"
    values:
      - "Blob copy - Function App + 2 Storage accounts | blob-transfer"
      - "Event flow - Logic App + Event Grid + 2 Storage accounts | logic-app-event-grid"
  - name: workloadName
    displayName: "2. Instance name (Blob copy = blobcopy; Event flow = eventflow)"
    type: string
    default: "blobcopy"
    values:
      - "blobcopy"
      - "eventflow"
  - name: environment
    displayName: "3. Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "4. Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: runGuidance
    displayName: "Current behavior - deployment depends on target enablement"
    type: string
    default: "All checked-in targets are disabled: Deploy currently creates NO Azure resources. Once enabled, it creates the selected workload in its own resource group and Deployment Stack, publishes/reuses a Template Spec, and verifies the application. Use main and choose matching Resources > discovery."
    values:
      - "All checked-in targets are disabled: Deploy currently creates NO Azure resources. Once enabled, it creates the selected workload in its own resource group and Deployment Stack, publishes/reuses a Template Spec, and verifies the application. Use main and choose matching Resources > discovery."
  - name: usageEstimate
    displayName: "Cost assumptions - USD East US 2 retail as of 2026-09-19"
    type: string
    default: "References assume 730 hours/month, excluding tax/discounts/credits. Storage, Event Grid operations, logs, DNS, data transfer and agents cost extra. Exact selected estimate is frozen during qualification. Estimates are not spending caps. For workload-specific resource and dependency summaries, use the dedicated Blob copy or Event flow pipeline menu."
    values:
      - "References assume 730 hours/month, excluding tax/discounts/credits. Storage, Event Grid operations, logs, DNS, data transfer and agents cost extra. Exact selected estimate is frozen during qualification. Estimates are not spending caps. For workload-specific resource and dependency summaries, use the dedicated Blob copy or Event flow pipeline menu."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: ${{ split(parameters.workloadType, ' | ')[1] }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
