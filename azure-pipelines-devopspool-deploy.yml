# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Deploy - Managed DevOps Pool. Fixed workload: managed-devops-pool.

resources:
  pipelines:
    - pipeline: discovery
      source: "Discover - Managed DevOps Pool"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadName
    displayName: "Instance"
    type: string
    default: "devopspool"
    values:
      - "devopspool"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: namingInstanceId
    displayName: "Naming instance (reviewed UUID; drafts are Preview-only)"
    type: string
    default: "legacy"
    values:
      - "legacy"
  - name: executionMode
    displayName: "Run stages"
    type: string
    default: "Preview only"
    values:
      - "Preview only"
      - "Preview and deploy"
  - name: runGuidance
    displayName: "Current target status"
    type: string
    default: "All Managed DevOps Pool targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
    values:
      - "All Managed DevOps Pool targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
  - name: workloadSummary
    displayName: "Managed DevOps Pool - resources created when enabled"
    type: string
    default: "Microsoft-managed stateless Windows Gen2 build agents injected into an existing exclusive delegated subnet, bounded concurrency, pinned image, zero standby and project-scoped Azure DevOps pool access. Reuses an approved DevCenter project."
    values:
      - "Microsoft-managed stateless Windows Gen2 build agents injected into an existing exclusive delegated subnet, bounded concurrency, pinned image, zero standby and project-scoped Azure DevOps pool access. Reuses an approved DevCenter project."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
    default: "Existing same-region DevCenter project and dedicated subnet delegated to Microsoft.DevOpsInfrastructure/pools, reviewed service-principal network permissions, outbound routing/DNS, ADO project pool-creation rights and explicit administrator groups. Uses a separate existing bootstrap agent pool; never creates itself from its own agents."
    values:
      - "Existing same-region DevCenter project and dedicated subnet delegated to Microsoft.DevOpsInfrastructure/pools, reviewed service-principal network permissions, outbound routing/DNS, ADO project pool-creation rights and explicit administrator groups. Uses a separate existing bootstrap agent pool; never creates itself from its own agents."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - Managed DevOps Pool under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
      - "Select a successful main run from Discover - Managed DevOps Pool under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
  - name: costAssumptions
    displayName: "Cost assumptions - retail as of not yet qualified"
    type: string
    default: "Estimate unavailable: not zero/free. Ephemeral agent VM compute, OS disk/storage, Azure DevOps parallel-job entitlement, network egress/NAT/firewall, image maintenance and optional logs. No complete reviewed estimate; zero standby is not zero cost. Complete reviewed pricing and platform onboarding before enabling deployment."
    values:
      - "Estimate unavailable: not zero/free. Ephemeral agent VM compute, OS disk/storage, Azure DevOps parallel-job entitlement, network egress/NAT/firewall, image maintenance and optional logs. No complete reviewed estimate; zero standby is not zero cost. Complete reviewed pricing and platform onboarding before enabling deployment."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: managed-devops-pool
    executionMode: ${{ parameters.executionMode }}
    namingInstanceId: ${{ parameters.namingInstanceId }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
