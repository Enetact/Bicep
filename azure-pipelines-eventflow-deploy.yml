# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Deploy - Event flow. Fixed workload: logic-app-event-grid.

resources:
  pipelines:
    - pipeline: discovery
      source: "Discover - Event flow"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadName
    displayName: "Instance"
    type: string
    default: "eventflow"
    values:
      - "eventflow"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: executionMode
    displayName: "Run stages"
    type: string
    default: "Preview only"
    values:
      - "Preview only"
      - "Preview and deploy"
  - name: runGuidance
    displayName: "Current target status"
    type: string
    default: "All Event flow targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
    values:
      - "All Event flow targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
  - name: workloadSummary
    displayName: "Event flow - resources created when enabled"
    type: string
    default: "Processes document events: 1 Logic App Standard + hosting plan, 1 Event Grid topic + subscription, 2 Storage accounts, events queue, receipt/quarantine/dead-letter containers, 8 private endpoints, managed identities, Application Insights and 5 alerts."
    values:
      - "Processes document events: 1 Logic App Standard + hosting plan, 1 Event Grid topic + subscription, 2 Storage accounts, events queue, receipt/quarantine/dead-letter containers, 8 private endpoints, managed identities, Application Insights and 5 alerts."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
    default: "Requires 2 existing subnets, 6 linked private DNS zones, a Log Analytics workspace, private agent and 2 platform exception approvals. Creates NO shared VNet/DNS/workspace or destination data lake. WS1 + 8 endpoints: $233.56/month fixed subtotal; usage and 5 alerts extra."
    values:
      - "Requires 2 existing subnets, 6 linked private DNS zones, a Log Analytics workspace, private agent and 2 platform exception approvals. Creates NO shared VNet/DNS/workspace or destination data lake. WS1 + 8 endpoints: $233.56/month fixed subtotal; usage and 5 alerts extra."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - Event flow under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
      - "Select a successful main run from Discover - Event flow under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
  - name: costAssumptions
    displayName: "Cost assumptions - retail as of 2026-09-19"
    type: string
    default: "USD East US 2 retail, 730 hours/month; tax, discounts and credits excluded. Storage, logs, DNS, network transfer and agents are additional. Preview freezes the selected estimate; this is not a spending cap. Event Grid operations and alerts are also additional."
    values:
      - "USD East US 2 retail, 730 hours/month; tax, discounts and credits excluded. Storage, logs, DNS, network transfer and agents are additional. Preview freezes the selected estimate; this is not a spending cap. Event Grid operations and alerts are also additional."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: logic-app-event-grid
    executionMode: ${{ parameters.executionMode }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
