trigger:
  branches:
    include: [main]

pool:
  vmImage: windows-latest

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - pwsh: |
      az bicep install --version v0.47.16
      if ($LASTEXITCODE -ne 0) { throw 'Bicep install failed.' }
      ./scripts/Test-Project.ps1
    displayName: Compile all environments and test transfer contracts
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - pwsh: ./scripts/Test-Recovery.ps1
    displayName: Exercise duplicates and recovery using local Azurite
  - pwsh: ./scripts/Build-Package.ps1 -ReleaseId '$(Build.BuildId)'
    displayName: Build immutable Function package
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: artifacts
      artifact: blob-transfer
    displayName: Publish compiled templates and package
# No automatic deployment. Add protected environment approvals and a private-network
# self-hosted deployment agent with workload identity federation for release stages.
