# Manual cloud-free qualification. Discover and Deploy have separate entry files.
trigger: none
pr: none

jobs:
  - job: QualifyApplication
    displayName: Test, exercise locally and package
    timeoutInMinutes: 120
    cancelTimeoutInMinutes: 5
    pool:
      vmImage: windows-latest
    steps:
      - checkout: self
        clean: true
        persistCredentials: false
      - template: pipelines/templates/steps/qualify-application.yml
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: artifacts/releases/$(Build.BuildId)
          artifact: blob-transfer
        displayName: Publish compiled templates and package
      - template: pipelines/templates/steps/publish-qualification.yml
        parameters:
          artifactName: validation-evidence
      # Preserve the standalone local-host artifact for existing users.
      - pwsh: |
          if (Test-Path -LiteralPath '.local/logs') {
            Write-Host '##vso[task.setvariable variable=localHostEvidenceAvailable]true'
          }
        condition: always()
        displayName: Locate available local host evidence
      - task: PublishPipelineArtifact@1
        condition: and(always(), eq(variables['localHostEvidenceAvailable'], 'true'))
        inputs:
          targetPath: .local/logs
          artifact: local-host-evidence
        displayName: Publish available local host logs
