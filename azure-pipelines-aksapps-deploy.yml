# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Deploy - Private AKS Foundation. Fixed workload: private-aks.

resources:
  pipelines:
    - pipeline: discovery
      source: "Discover - Private AKS Foundation"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadName
    displayName: "Instance"
    type: string
    default: "aksapps"
    values:
      - "aksapps"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: executionMode
    displayName: "Run stages"
    type: string
    default: "Preview only"
    values:
      - "Preview only"
      - "Preview and deploy"
  - name: runGuidance
    displayName: "Current target status"
    type: string
    default: "All Private AKS Foundation targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
    values:
      - "All Private AKS Foundation targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
  - name: workloadSummary
    displayName: "Private AKS Foundation - resources created when enabled"
    type: string
    default: "Private Standard AKS, 3 system nodes and 3-10 autoscaled app nodes across three zones, Azure Linux 3, Cilium overlay, Entra RBAC, OIDC/workload identity, an application identity/federation, Azure Policy, Key Vault CSI and control-plane diagnostics. Helm applications use a separate manual pipeline."
    values:
      - "Private Standard AKS, 3 system nodes and 3-10 autoscaled app nodes across three zones, Azure Linux 3, Cilium overlay, Entra RBAC, OIDC/workload identity, an application identity/federation, Azure Policy, Key Vault CSI and control-plane diagnostics. Helm applications use a separate manual pipeline."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
    default: "Approved existing node subnet/NAT, private DNS, private Premium ACR, two platform identities with scoped roles, Entra groups, Log Analytics and reviewed nonoverlapping IP ranges. Private agent and namespace onboarding required. No automatic subnet allocation."
    values:
      - "Approved existing node subnet/NAT, private DNS, private Premium ACR, two platform identities with scoped roles, Entra groups, Log Analytics and reviewed nonoverlapping IP ranges. Private agent and namespace onboarding required. No automatic subnet allocation."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - Private AKS Foundation under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
      - "Select a successful main run from Discover - Private AKS Foundation under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
  - name: costAssumptions
    displayName: "Cost assumptions - retail as of not yet qualified"
    type: string
    default: "Estimate unavailable: not zero/free. Standard AKS control plane, at least six VMs and disks, ACR Premium, NAT, private connectivity, Defender and log ingestion. No complete price estimate; not free. Complete reviewed pricing and platform onboarding before enabling deployment."
    values:
      - "Estimate unavailable: not zero/free. Standard AKS control plane, at least six VMs and disks, ACR Premium, NAT, private connectivity, Defender and log ingestion. No complete price estimate; not free. Complete reviewed pricing and platform onboarding before enabling deployment."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: private-aks
    executionMode: ${{ parameters.executionMode }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
