# Generated by scripts/Update-ServiceCatalog.ps1. Review catalog changes before merging.
trigger: none
pr: none
# ADO definition: Deploy - Fabric Premium Workspace. Fixed workload: fabric.

resources:
  pipelines:
    - pipeline: discovery
      source: "Discover - Fabric Premium Workspace"
      branch: refs/heads/main
      trigger: none

parameters:
  - name: workloadName
    displayName: "Instance"
    type: string
    default: "fabric"
    values:
      - "fabric"
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "prod"
      - "qa"
      - "uat"
  - name: region
    displayName: "Approved region"
    type: string
    default: "eastus2"
    values:
      - "eastus2"
  - name: namingInstanceId
    displayName: "Naming instance (reviewed UUID; drafts are Preview-only)"
    type: string
    default: "legacy"
    values:
      - "legacy"
  - name: executionMode
    displayName: "Run stages"
    type: string
    default: "Preview only"
    values:
      - "Preview only"
      - "Preview and deploy"
  - name: runGuidance
    displayName: "Current target status"
    type: string
    default: "All Fabric Premium Workspace targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
    values:
      - "All Fabric Premium Workspace targets are disabled: Preview is available with configured inputs; Deploy is blocked until platform enablement."
  - name: workloadSummary
    displayName: "Fabric Premium Workspace - resources created when enabled"
    type: string
    default: "F64-or-larger Fabric capacity with a separately provisioned Managed DevOps Pool for protected delivery. Existing private workspaces use their reviewed workspace API endpoint, isolated subnets and private DNS checks."
    values:
      - "F64-or-larger Fabric capacity with a separately provisioned Managed DevOps Pool for protected delivery. Existing private workspaces use their reviewed workspace API endpoint, isolated subnets and private DNS checks."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
    default: "Complete the selected environment's fabric-<env>-agents pool binding: existing DevCenter project, stateless Windows Gen2 agents with a pinned image, approved ADO project and pool IDs. The dedicated agent subnet must be delegated to Microsoft.DevOpsInfrastructure/pools, with reviewed Reader and Network Contributor grants. Fabric endpoints use a separate subnet in the same VNet; this profile requires Azure DNS and private IPv4 connectivity. Configure WIF deployment identity, job-token pool-read access, Fabric tenant/workspace roles, F capacity quota/admin users and monitoring. Source readiness is shown separately from pipeline verification; native Fabric deployment pipelines remain unsupported for deny-public workspaces."
    values:
      - "Complete the selected environment's fabric-<env>-agents pool binding: existing DevCenter project, stateless Windows Gen2 agents with a pinned image, approved ADO project and pool IDs. The dedicated agent subnet must be delegated to Microsoft.DevOpsInfrastructure/pools, with reviewed Reader and Network Contributor grants. Fabric endpoints use a separate subnet in the same VNet; this profile requires Azure DNS and private IPv4 connectivity. Configure WIF deployment identity, job-token pool-read access, Fabric tenant/workspace roles, F capacity quota/admin users and monitoring. Source readiness is shown separately from pipeline verification; native Fabric deployment pipelines remain unsupported for deny-public workspaces."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - Fabric Premium Workspace under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
      - "Select a successful main run from Discover - Fabric Premium Workspace under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
  - name: costAssumptions
    displayName: "Cost assumptions - retail as of not yet qualified"
    type: string
    default: "Estimate unavailable: not zero/free. F64-or-larger capacity compute, OneLake storage, connection/gateway operations, private endpoints and log ingestion; referenced managed-agent VM/disk use, networking and ADO parallel-job entitlement also incur costs. No complete reviewed estimate; not free. Complete reviewed pricing and platform onboarding before enabling deployment."
    values:
      - "Estimate unavailable: not zero/free. F64-or-larger capacity compute, OneLake storage, connection/gateway operations, private endpoints and log ingestion; referenced managed-agent VM/disk use, networking and ADO parallel-job entitlement also incur costs. No complete reviewed estimate; not free. Complete reviewed pricing and platform onboarding before enabling deployment."

extends:
  template: pipelines/deploy-entry.yml
  parameters:
    workloadType: fabric
    executionMode: ${{ parameters.executionMode }}
    namingInstanceId: ${{ parameters.namingInstanceId }}
    workloadName: ${{ parameters.workloadName }}
    environment: ${{ parameters.environment }}
    region: ${{ parameters.region }}
    discoveryPipelineId: $(resources.pipeline.discovery.pipelineID)
    discoveryRunId: $(resources.pipeline.discovery.runID)
