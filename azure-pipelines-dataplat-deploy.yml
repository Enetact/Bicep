    values:
      - "Databricks Premium (VNet injected, no public IP), Data Factory v2 with managed VNet/IR, MSI linked services, a manual notebook check, file staging and optional reviewed Databricks Job orchestration, ADLS Gen2 landing/curated storage, separate lake/root access connector identities, root storage firewall, scoped RBAC, 7 private endpoints, 3 ADF managed endpoints and diagnostics. No automatic job execution."
  - name: requirements
    displayName: "Existing dependencies and cost"
    type: string
