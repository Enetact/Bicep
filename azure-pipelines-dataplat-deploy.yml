    values:
      - "Reuses approved same-VNet /26-or-larger Databricks host/container subnets with NSGs and NAT egress, endpoint subnet, 5 linked private DNS zones, regional browser-auth endpoint and Log Analytics. Endpoint approvals, Databricks identity/Unity Catalog/notebook onboarding and runtime qualification are separate acceptance steps. Job launcher requires a published reviewed Job ID; workspace bundle exports are local setup artifacts, not automatic deployment."
  - name: lifecycle
    displayName: "Deployment and discovery handoff"
    type: string
    default: "Select a successful main run from Discover - Private Data Platform under Resources > discovery. Preview only is the default: validates Bicep and uploads resource/property changes to Summary / Extensions. Preview and deploy runs stage 2 after stage 1 succeeds, using the reviewed inputs, Template Specs, Deployment Stacks and application verification. Environment approvals must be configured in ADO."
    values:
