    values:
      - "Estimate unavailable: not zero/free. Premium Databricks DBUs plus driver/workers, ADF orchestration/IR, storage/operations, 7 private endpoints plus 3 managed endpoints, shared NAT/auth/DNS and log ingestion. No complete estimate yet; not free. Complete reviewed pricing and platform onboarding before enabling deployment."

extends:
